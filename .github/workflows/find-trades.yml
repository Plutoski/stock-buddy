# Every 10 minutes, ask the live app to look for Stock Buddy trades on Base that weren't
# reported by the browser (for example, because the visitor closed the tab).
# GitHub may run scheduled jobs a few minutes late; that is fine here.
name: Find trades and refresh prices
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run the trade finder
        run: curl -fsS --max-time 60 "https://stock-buddy-gnt7.vercel.app/api/scan"
      # Keep the cached stock list and prices fresh, so visitors never wait for Coinbase or KyberSwap.
      - name: Refresh cached prices
        run: |
          curl -fsS -o /dev/null --max-time 60 "https://stock-buddy-gnt7.vercel.app/api/stocks" || true
          curl -fsS -o /dev/null --max-time 60 "https://stock-buddy-gnt7.vercel.app/api/prices" || true
